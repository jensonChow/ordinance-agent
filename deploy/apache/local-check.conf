# A runnable copy of basic-law.conf, cut down so the reverse-proxy behaviour can be exercised without root,
# without TLS and without touching the system Apache configuration:
#
#   deploy/apache/local-check.sh            # starts httpd on :8080, runs the checks, stops it
#
# What it keeps from the real vhost — and therefore what the check actually tests:
#   * the two upstreams and their paths (/ → Next.js, /citations/ → gunicorn)
#   * the <Location "/api/chat"> block with flushpackets=on, the setting that decides whether a token stream
#     reaches the browser incrementally or all at once when the response ends
# What it drops: TLS, HTTP/2, the log paths and the redirect vhost — none of which the proxying depends on.
#
# Paths are macOS system-Apache paths (/usr/libexec/apache2); on Debian the module directory is
# /usr/lib/apache2/modules and the modules are enabled with a2enmod instead.

ServerName   127.0.0.1
Listen       ${APACHE_PORT}
# Unprivileged run: everything Apache writes has to go somewhere this user owns. The defaults are /private/var/run,
# which is why an httpd started without root otherwise dies on "Couldn't create the proxy mutex".
DefaultRuntimeDir "${APACHE_RUN}"
Mutex        "file:${APACHE_RUN}" default
PidFile      "${APACHE_RUN}/httpd.pid"
ErrorLog     "${APACHE_RUN}/error.log"
CustomLog    "${APACHE_RUN}/access.log" common
DocumentRoot "${APACHE_RUN}/htdocs"

# Guarded, because the same file has to load on two builds: macOS ships these as shared modules, while Debian
# compiles some of them in and would refuse a second LoadModule of a module it already has.
<IfModule !mpm_event_module>
    LoadModule mpm_event_module  ${APACHE_MODULES}/mod_mpm_event.so
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module ${APACHE_MODULES}/mod_authz_core.so
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module ${APACHE_MODULES}/mod_log_config.so
</IfModule>
<IfModule !env_module>
    LoadModule env_module        ${APACHE_MODULES}/mod_env.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module    ${APACHE_MODULES}/mod_headers.so
</IfModule>
<IfModule !proxy_module>
    LoadModule proxy_module      ${APACHE_MODULES}/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module ${APACHE_MODULES}/mod_proxy_http.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module      ${APACHE_MODULES}/mod_unixd.so
</IfModule>

<Directory />
    Require all denied
</Directory>

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "http"

# --- Python citation service (Flask under Gunicorn) -------------------------------------------------
ProxyPass        /citations/ http://127.0.0.1:8000/ retry=1 timeout=10
ProxyPassReverse /citations/ http://127.0.0.1:8000/

# --- Next.js app ------------------------------------------------------------------------------------
# Long timeout: /api/chat streams a tool-calling loop, so a response can stay open for tens of seconds.
# Buffering must stay off or the token stream arrives in one lump at the end.
<Location "/api/chat">
    ProxyPass        http://127.0.0.1:${APP_PORT}/api/chat timeout=120 flushpackets=on
    ProxyPassReverse http://127.0.0.1:${APP_PORT}/api/chat
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0
</Location>

ProxyPass        / http://127.0.0.1:${APP_PORT}/ timeout=60
ProxyPassReverse / http://127.0.0.1:${APP_PORT}/
