# Example Apache vhost: Apache terminates TLS and reverse-proxies two upstreams —
#   /                     → the Next.js app          (node, 127.0.0.1:3000)
#   /citations/*          → the Python service       (gunicorn, 127.0.0.1:8000, see ../../services/citation-py)
#
# This is the shape used when the app is deployed on a normal Linux host rather than on Vercel. It is an
# EXAMPLE: it is committed as documentation and has not been run in this repository's CI. Nothing in the
# application depends on it — /api/chat reaches the MCP server on its own origin, and the Python service is
# optional (CITATION_SERVICE_URL).
#
# Enable first:  a2enmod proxy proxy_http headers ssl http2 && a2ensite basic-law && apachectl configtest

<VirtualHost *:80>
    ServerName basic-law.example.edu
    RedirectPermanent / https://basic-law.example.edu/
</VirtualHost>

<VirtualHost *:443>
    ServerName basic-law.example.edu

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/basic-law.pem
    SSLCertificateKeyFile   /etc/ssl/private/basic-law.key
    Protocols h2 http/1.1

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # --- Python citation service (Flask under Gunicorn) -----------------------------------------------
    # Mounted under a prefix so the Node app and the legacy Python app can share one hostname. Set
    # CITATION_SERVICE_URL=https://basic-law.example.edu/citations for the agent to use it.
    ProxyPass        /citations/ http://127.0.0.1:8000/ retry=1 timeout=10
    ProxyPassReverse /citations/ http://127.0.0.1:8000/

    # --- Next.js app ----------------------------------------------------------------------------------
    # Long timeout: /api/chat streams a tool-calling loop, so a response can stay open for tens of seconds.
    # Buffering must stay off or the token stream arrives in one lump at the end.
    <Location "/api/chat">
        ProxyPass        http://127.0.0.1:3000/api/chat timeout=120 flushpackets=on
        ProxyPassReverse http://127.0.0.1:3000/api/chat
        SetEnv proxy-sendchunked 1
        SetEnv proxy-nokeepalive 0
    </Location>

    ProxyPass        / http://127.0.0.1:3000/ timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/basic-law-error.log
    CustomLog ${APACHE_LOG_DIR}/basic-law-access.log combined
</VirtualHost>
