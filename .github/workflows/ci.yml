name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordinance_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ordinance_agent
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # The sentence-embedding model lives in the project (models/), which is how the deployment gets it into the
      # serverless function; cache that directory so CI does not re-download it. The previous key here pointed at
      # ~/.cache/huggingface, which transformers.js never writes — so the cache never hit and every run pulled the
      # weights again.
      - uses: actions/cache@v4
        with:
          path: models
          key: model-Xenova-all-MiniLM-L6-v2-q8
      - run: npm run model:fetch
      # EMBEDDING_LOCAL_ONLY makes a missing models/ an error instead of a silent fetch from huggingface.co, so CI
      # is actually testing the path the deployment uses.
      - run: npm run embed
        env:
          EMBEDDING_LOCAL_ONLY: "1"
      # LayoutProps / PageProps and the route types are generated by `next dev`, `next build` or
      # `next typegen`. On a clean checkout none of them has run yet, so tsc must generate them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run eval:retrieval
        env:
          EMBEDDING_LOCAL_ONLY: "1"
      - name: build
        run: npm run build
      - name: end-to-end smoke test (mock model, real tool loop, real database)
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/notes >/dev/null && break; sleep 1; done
          node scripts/smoke-chat.mjs http://127.0.0.1:3100
      # deploy/apache/ used to be an example that had never been executed. This runs it: both upstreams through the
      # proxy, and the /api/chat token stream checked to be still arriving incrementally rather than buffered.
      - name: reverse proxy (Apache) end-to-end
        env:
          # Debian names the binary apache2 and keeps its modules elsewhere than macOS does.
          HTTPD: /usr/sbin/apache2
          APACHE_MODULES: /usr/lib/apache2/modules
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apache2 >/dev/null
          python3 -m venv services/citation-py/.venv
          services/citation-py/.venv/bin/pip install -q -r services/citation-py/requirements.txt
          (cd services/citation-py && .venv/bin/gunicorn -w 2 -b 127.0.0.1:8000 app:app &)
          # The smoke-test step left the app running; only start one if it did not.
          curl -sf http://127.0.0.1:3100/api/notes >/dev/null || npm run start -- -p 3100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/notes >/dev/null && break; sleep 1; done
          deploy/apache/local-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: eval/
